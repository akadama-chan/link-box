<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f4ee"><title>🍋 用途別リンク箱</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍋</text></svg>"><link rel="stylesheet" href="style.css"></head><body>
<header><div><h1>🍋 用途別リンク箱</h1><p>繰り返し使うリンクを、好きな箱の定位置へ。</p></div><div class="backup" id="backupStatus">最終JSON書き出し：まだありません</div></header>
<main>
<section id="homeView"><section class="toolbar"><div><strong id="boxCount">0箱</strong><button class="primary" id="newBox">＋ 箱を作る</button></div><div class="tools"><button id="toggleBoxEdit">編集</button><button id="exportJson">JSON書き出し</button><label class="file-button">JSON読み込み<input id="importJson" type="file" accept="application/json,.json"></label><button class="danger-outline" id="resetAll">全件リセット</button></div></section><section id="homeEmpty" class="empty">まだ箱はありません。しょうもない箱も歓迎です。</section><section id="boxes" class="boxes"></section></section>
<section id="boxView" class="hidden"><section class="toolbar"><div><button id="backHome">← 箱一覧</button><h2 id="boxHeading"></h2><strong id="linkCount"></strong></div><div class="tools"><button class="primary" id="newLink">＋ リンク追加</button><button id="toggleLinkEdit">編集</button><button id="exportHtml">この箱をHTML書き出し</button></div></section><section id="linkEmpty" class="empty">この箱はまだ空です。</section><section id="cards" class="cards"></section></section>
</main>
<dialog id="boxDialog"><form id="boxForm"><h2 id="boxDialogTitle">箱を作る</h2><input type="hidden" id="boxEditId"><label>アイコン <span>任意</span><input id="boxIcon" type="text" maxlength="12" placeholder="🍋"></label><label>箱名 <input id="boxName" type="text" required placeholder="無料漫画"></label><div class="dialog-actions"><button type="button" data-close="boxDialog">キャンセル</button><button class="primary" type="submit">保存</button></div></form></dialog>
<dialog id="linkDialog"><form id="linkForm"><h2 id="linkDialogTitle">リンク追加</h2><input type="hidden" id="linkEditId"><label>URL <input id="linkUrl" type="url" inputmode="url" required placeholder="https://example.com"></label><label>タイトル <span>任意</span><input id="linkTitle" type="text" placeholder="空ならURLを表示"></label><label>メモ <span>任意</span><textarea id="linkMemo" rows="3"></textarea></label><label>所属する箱 <select id="linkBox"></select></label><div id="linkError" class="error"></div><div class="dialog-actions"><button type="button" data-close="linkDialog">キャンセル</button><button class="primary" type="submit">保存</button></div></form></dialog>
<dialog id="mergeDialog"><div><h2>マージ時の衝突</h2><p id="mergeProgress"></p><div class="compare"><article><h3>現在側</h3><div id="currentItem"></div></article><article><h3>読み込み側</h3><div id="incomingItem"></div></article></div><div class="dialog-actions wrap"><button data-choice="current">現在を残す</button><button data-choice="incoming">読み込み側を採用</button><button data-choice="both">どちらも残す</button></div></div></dialog>
<script src="app.js"></script></body></html>
